[project]
name = "guardian-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
]

# Model weights are an explicit opt-in. Installing the base service does not
# pull torch or transformers, so a developer without a GPU still gets a running
# service on the rule fallback.
[project.optional-dependencies]
models = [
  "transformers>=4.44",
  "torch>=2.4",
  "sentence-transformers>=3.1",
  "numpy>=2.0",
]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
