# Guardian local infrastructure. Ports are shifted off the defaults so a
# Postgres or Redis already installed on the host is not shadowed.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6381:6379"]
volumes:
  pgdata:
