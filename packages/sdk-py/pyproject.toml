[project]
name = "guardian-sdk"
version = "0.0.1"
description = "Customer-facing Python SDK for Guardian. Sends events and verifies the tier webhook."
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
]

# Nothing beyond pydantic and httpx at runtime. The SDK is the thing a customer
# installs into their own service, so every extra dependency is a cost they pay.
[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
